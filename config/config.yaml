
app:
  title: "News Crawler API"
  description: "API for news crawling and management"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 18080
  debug: false
  cors:
    allow_origins: ["*"]
    allow_credentials: true
    allow_methods: ["*"]
    allow_headers: ["*"]

database:
  host: "localhost"
  user: "root"
  password: "123456"
  db: "news_crawler"
  charset: "utf8mb4"
  autocommit: true


redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  decode_responses: false
  socket_timeout: 5
  socket_connect_timeout: 5
  health_check_interval: 30

crawler:
  interval: 1800
  timeout: 1700
  max_retry_count: 2
  max_instances: 2
  misfire_grace_time: 300

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  dir: "logs"
  file: "app.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  daily_backup_count: 30
  timezone: "Asia/Shanghai"

notification:
  dingtalk:
    enabled: false
    webhook_url: ""
    secret: ""
    timeout: 10
    notify_success: false


scheduler:
  thread_pool_size: 20
  process_pool_size: 5
  coalesce: true
  max_instances: 2
  misfire_grace_time: 300
  timezone: "Asia/Shanghai"

llm:
  enabled: true
  # 可选值："codex-responses"（ChatGPT Codex Responses 接口，必须使用流式响应）或
  # "openai-compatible"（标准 /chat/completions 兼容接口）。
  provider: "codex-responses"
  base_url: "https://chatgpt.com/backend-api/codex/responses"
  codex_token: ""
  codex_account_id: ""
  stream: true
  api_key: ""
  model: "gpt-5.6-terra"
  timeout: 60
  temperature: 0.3
  max_tokens: 1200
  summary_expire: 0
  summary_platforms: []
  summary_platform_news_limit: 10
